{% if form.non_field_errors %}<div class="alert alert-danger py-2">{{ form.non_field_errors|join:" " }}</div>{% endif %}
<div class="row g-3">
    {% for veld in form %}
        <div class="{% if veld.name == 'opmerking' %}col-12{% else %}col-md-6{% endif %}">
            <label class="form-label" for="{{ veld.id_for_label }}">{{ veld.label }}</label>
            {{ veld }}
            {% if veld.help_text %}<div class="form-text ml-dim">{{ veld.help_text }}</div>{% endif %}
            {% for fout in veld.errors %}<div class="text-danger small">{{ fout }}</div>{% endfor %}
        </div>
    {% endfor %}
</div>
